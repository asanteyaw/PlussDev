# apiref_manifest_classic.toml -- the `pluss::ai::classic` public framework.
# `classic` is the public name for the classical-ML engine; the substrate name
# must never appear in rendered pages. Drive the toolchain at this file with
#   python3 apiref.py <cmd> --manifest apiref_manifest_classic.toml
# `apiref.py nav` still bundles every apiref_manifest*.toml into one sidebar.

[framework.classic]
title = "classic"
summary = "PlussAI classical machine-learning framework."
include = "<pluss/ai/ml.h>"
header = "PlussAI/include/pluss/ai/nodej"

# ===========================================================================
#  FAMILIES
# ===========================================================================

