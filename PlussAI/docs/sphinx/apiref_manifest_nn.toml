# apiref_manifest_nn.toml -- the `pluss::ai::nn` public framework.
# `nn` is the public name for the neural-network engine, matching the
# internal namespace exactly -- unlike `nodej`/`nodeb`/`nodek`, `nn` was
# already clean and human-presentable (same convention as `torch::nn`), so
# there is no separate public alias to translate through; the substrate
# source-directory name `NodeK` must still never appear in rendered pages.
# Drive the toolchain at this file with
#   python3 apiref.py <cmd> --manifest apiref_manifest_nn.toml
# `apiref.py nav` still bundles every apiref_manifest*.toml into one sidebar.
#
# Organized by category (module/activation/normalization/embedding/fusion/
# cnn/rnn/attention/losses/functional/grad/optim/data), not by family, since
# that is the pattern every neural-network reference actually uses -- nn is
# not family-based like classic. Two things worth flagging up front:
#   - the functional-layer free functions (nn/functional) live under
#     pluss::ai::nn, exactly like every other symbol here -- they used to be
#     re-exported into the bare `pluss::` root namespace (a real namespace
#     leak) but were moved as part of this same effort. Root now keeps only
#     things truly global across the whole codebase. Also reachable via the
#     top-level alias pluss::nn::* (`namespace pluss { namespace nn =
#     ::pluss::ai::nn; }`), which is how most existing code in this repo
#     already spells it -- the manifest itself standardizes on the fully
#     qualified pluss::ai::nn throughout, same as every other category here.
#   - nn/data documents `pluss::loader` (an alias of `pluss::tils`), which
#     physically lives in PlussTils, not PlussAI -- included because it is
#     the DataLoader stack purpose-built to pair with nn training.
# Do not use any external framework's name anywhere in these pages. `Fusion`
# is documented as the fully connected layer, never as "Linear".

[framework.nn]
title = "nn"
summary = "PlussAI neural-network module framework."
include = "<pluss/ai/nn.h>"
header = ["PlussAI", "PlussTils/include/pluss/tils/aux"]
# `header` accepts a list of directories/files apiref.py rglobs("*.h")
# under; nn's real symbols span PlussAI/NodeK, PlussAI/include/pluss
# (covered by "PlussAI") and PlussTils/include/pluss/tils/aux (nn/data's
# pluss::loader -- Dataset/SeriesDataset/DataLoader/Sampler and its
# subclasses -- physically defined in data_loader.h/sampler.h there).
# <pluss/ai/nn.h> itself #includes "pluss/tils/aux/data_loader.h" (see that
# header) so this second path matches nn.h's own real dependency, not an
# approximation of it.

# ===========================================================================
#  FAMILIES
# ===========================================================================

[[family]]
path = "nn/module"
page = "api/nn/module.md"
title = "module"
maxdepth = 2
children = ["module/Introduction", "module/Module", "module/Schedule"]

