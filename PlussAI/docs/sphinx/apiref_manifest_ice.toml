# apiref_manifest_ice.toml -- the `pluss::ai::ice` public framework.
# `ice` is PlussAI's convenience/training layer over `nn` (NodeK) -- see
# PlussAI/Ice/ICE_BLUEPRINT.md for the full design rationale. It plays two
# roles: a PyTorch-Lightning-shaped trainer (Model/Outline/Coach/Recipe --
# public alias TrainOptions -- remove the hand-written optimizer-wiring/
# training-loop/checkpointing boilerplate) and a PyTorch-Forecasting-shaped
# catalog of ready-made "nice, niche" architectures (models/ts, models/nlp,
# models/rl) that `nn` itself deliberately does not provide.
# Drive the toolchain at this file with
#   python3 apiref.py <cmd> --manifest apiref_manifest_ice.toml
#
# Organized by category (platform/options/step/model/outline/optim/no_grad/
# callback/coach/source/io/data/models_ts/models_nlp/models_rl), not by
# family, matching nn's own precedent (ice is not family-based like classic).
# Locked order rationale: platform/options/step come first because every
# later category's signatures reference TrainPlatform/TrainOptions/Batch;
# model -> outline -> optim -> no_grad -> callback -> coach -> source -> io
# follows the dependency order a reader actually needs (the core abstract
# base, then its thin convenience wrapper, then the two escape hatches, then
# the extensibility/orchestration/data-feeding/persistence layers built on
# top of it); data comes before models_* because every model catalog entry's
# *Batch type is constructed from data::Batch/data::TimeSeriesBatch; models_ts
# before models_nlp before models_rl matches the blueprint's own Phase 4/5
# build order (ts was the first "nice/niche" entry built).
#
# Two things worth flagging up front:
#   - There are TWO distinct `Batch` types: `pluss::ai::ice::Batch` (step.h,
#     a flat field-list the training loop feeds to Model::forward/
#     compute_loss) and `pluss::ai::ice::data::Batch` (data/dataset.h, has a
#     Layout + per-field CategoricalVariables, what a Source's
#     learn_batches()/etc. vectors hold and what every model catalog's own
#     *Batch type -- TFTBatch, AutoregressiveBatch, TimeSeriesBatch itself --
#     converts from). Every page reachable from one is cross-linked to the
#     other, and prose always says "core Batch" vs "data::Batch" rather than
#     just "Batch" wherever the two could be confused.
#   - Several `*TrainOptions` structs across `options` and every models_*
#     family reuse the SAME shared sub-options (ValidationPolicy,
#     ArchitectureRegularization, ObjectiveRegularization, LoopRegularization,
#     CheckpointPolicy, ExecutionPolicy) -- exactly like nn/optim's
#     GradientClipOptions/ExecutionOptions being shared across all 7
#     optimizers -- so none of them get `owner=`; they stay siblings at
#     `ice/options` family level and every model's own *TrainOptions page
#     cross-links back to them instead of re-explaining each field.
#   - `AutoregressiveForecaster`/`TemporalFusionTransformer::save`/`load` and
#     `TextJudge`/`ActionValueAgent`'s own save/load all build on the same
#     shared primitives: the text key=value artifact helpers in
#     `pluss/ai/ice/io/kv_artifact.h` (`io::detail::write_num_line`/
#     `require_i64`/etc. -- previously duplicated per-model, now shared) for
#     each model's own flat Options fields, plus the already-generic
#     `ice::io::save_parameters`/`load_parameters` for the tensor weights.
#     `TextJudge` additionally persists a label vocabulary (non-tensor
#     state no other catalog entry has).

[framework.ice]
title = "ice"
summary = "PlussAI training/runtime orchestration framework over nn."
include = "<pluss/ai/ice.h>"
header = "PlussAI"

