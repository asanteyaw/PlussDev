[[symbol]]
qualname = "pluss::ai::nlp::io::write_workflow"
kind = "function"
family = "nlp/io"
page = "api/nlp/io/write_workflow.md"
summary = "Serializes a Workflow's stage list and every stage's persisted state to a stream, in the current schema version -- what Workflow::save calls internally."
overloads = 1

[[symbol]]
qualname = "pluss::ai::nlp::io::read_workflow"
kind = "function"
family = "nlp/io"
page = "api/nlp/io/read_workflow.md"
summary = "Reconstructs a Workflow from a stream written by write_workflow, transparently upgrading any schema from v1 onward and failing fast with an explicit diagnostic on a truncated, corrupted, or unsupported artifact -- what Workflow::load calls internally."
overloads = 1
