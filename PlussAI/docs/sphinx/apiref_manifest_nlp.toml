# --- core ---------------------------------------------------------------
[[symbol]]
qualname = "pluss::ai::nlp::Doc"
kind = "class"
family = "nlp/core"
page = "api/nlp/core/Doc.md"
summary = "One processed document: raw text plus every annotation layer a Workflow's stages add -- tokens, sentences, phrases, matches, entities, and (for a textcat-bearing pipeline) a predicted label or label set."
methods = ["ensure_lexicon", "maybe_lexicon", "token_texts", "lemma_texts", "sentence_texts", "phrase_texts", "match_texts", "entity_texts", "children_of", "lineage_of", "branch_of", "left_edge_of", "right_edge_of"]

[[symbol]]
qualname = "pluss::ai::nlp::Span"
kind = "class"
family = "nlp/core"
page = "api/nlp/core/Span.md"
summary = "A labeled token range inside a Doc -- the shared shape behind sentences, phrases, matches, and entities."
methods = []

[[symbol]]
qualname = "pluss::ai::nlp::Token"
kind = "options"
family = "nlp/core"
page = "api/nlp/core/Token.md"
summary = "One token's full annotation: its character/string-id fields, surface/lemma/pos/role/entity-label strings, punctuation/sentence-boundary/spacing flags, and its own Morphology."
fields = ["index", "char_start", "char_end", "chief", "orth_id", "lower_id", "norm_id", "prefix_id", "suffix_id", "lemma_id", "morphology_id", "orth", "lemma", "pos", "role", "entity_label", "is_punct", "sentence_start", "sentence_end", "space_after", "morphology"]

[[symbol]]
qualname = "pluss::ai::nlp::Morphology"
kind = "options"
family = "nlp/core"
page = "api/nlp/core/Morphology.md"
summary = "A token's or lexeme's cached shape/casing/character-class analysis, computed once at tokenization time -- casing, token kind, length, ASCII/alpha/digit/hyphen/apostrophe flags, and normalized/shape/prefix/suffix string forms."
fields = ["casing", "kind", "length", "is_ascii", "has_alpha", "has_digit", "has_hyphen", "has_apostrophe", "is_titlecase", "is_uppercase", "is_lowercase", "is_number_like", "is_url", "is_email", "is_punct", "norm", "shape", "prefix", "suffix", "spec"]

[[symbol]]
qualname = "pluss::ai::nlp::Lexeme"
kind = "options"
family = "nlp/core"
page = "api/nlp/core/Lexeme.md"
summary = "The type-level (not occurrence-level) record a Lexicon keeps for one distinct surface form: its interned string ids, surface/lower/lemma/norm/prefix/suffix text, and its own Morphology."
fields = ["id", "lower_id", "norm_id", "prefix_id", "suffix_id", "morphology_id", "text", "lower", "lemma", "norm", "prefix", "suffix", "morphology"]

[[symbol]]
qualname = "pluss::ai::nlp::TextPool"
kind = "class"
family = "nlp/core"
page = "api/nlp/core/TextPool.md"
summary = "A deterministic string-interning table: every distinct string a Lexicon sees is stored once and addressed afterward by a stable StringId."
methods = []

[[symbol]]
qualname = "pluss::ai::nlp::MorphBank"
kind = "class"
family = "nlp/core"
page = "api/nlp/core/MorphBank.md"
summary = "The Morphology-side counterpart to TextPool: deduplicates and interns Morphology records by StringId, attached to the same TextPool a Lexicon uses for its own text interning."
methods = []

[[symbol]]
qualname = "pluss::ai::nlp::Lexicon"
kind = "class"
family = "nlp/core"
page = "api/nlp/core/Lexicon.md"
summary = "Per-Doc (by default) type-level lexical state: interns strings and Morphology records, and tracks one Lexeme per distinct surface form observed so far."
methods = ["intern", "lookup", "text", "observe", "find", "intern_morphology", "find_morphology", "size", "texts", "morphs", "clear"]

[[symbol]]
qualname = "pluss::ai::nlp::IStage"
kind = "class"
family = "nlp/core"
page = "api/nlp/core/IStage.md"
summary = "The contract every pipeline stage implements: apply() to transform a Doc, optional learn() for a trainable stage, and dump_state_lines()/load_state_lines() for persistence -- what a Workflow actually calls, and what a custom stage must provide to participate."
methods = ["apply", "dump_state_lines", "learn", "load_state_lines", "name"]

# --- workflow ---------------------------------------------------------------
[[symbol]]
qualname = "pluss::ai::nlp::Workflow"
kind = "class"
family = "nlp/workflow"
page = "api/nlp/workflow/Workflow.md"
summary = "The central pipeline object: an ordered stage list plus learn/infer/assess/save/load, run against raw text, a pluss::Note of text, or already-tokenized Docs."
methods = ["append_stage", "learn", "infer", "assess", "save", "load"]

[[symbol]]
qualname = "pluss::ai::nlp::WorkflowReport"
kind = "options"
family = "nlp/workflow"
page = "api/nlp/workflow/WorkflowReport.md"
