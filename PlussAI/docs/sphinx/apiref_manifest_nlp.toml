# apiref_manifest_nlp.toml -- the `pluss::ai::nlp` public framework.
# `nlp` is the public alias for PlussAI's text/NLP engine, internally named
# `nodeb` (see PlussAI/NodeB/NODEB_BLUEPRINT.md for the full design
# rationale -- `namespace nlp = ::pluss::ai::nodeb;` in
# PlussAI/include/pluss/ai/nlp.h is the exact alias). Drive the toolchain at
# this file with
#   python3 apiref.py <cmd> --manifest apiref_manifest_nlp.toml
#
# Organized by category (core/workflow/tasks/vectorize/embed/runtime/
# registry/resources/io), matching ice/procedure's own precedent (nlp is not
# family-based like classic/lymph). Locked order rationale: core first,
# since every later category's signatures reference Doc/Token/Span/Lexicon/
# IStage; workflow next, the central orchestrator built directly on core;
# tasks next, the stage catalog Workflow composes; vectorize and embed next,
# two independent, ready-made feature/embedding tools built on core alone
# (vectorize bridges to classic's classical-ML feature types; embed is
# self-contained deep NLP); runtime next, the lower-level NodeK-backed
# sequence-building escape hatch the Sequence-backend tasks and
# ContextualEmbedder use internally, for a caller who wants to build a
# custom sequence head directly; registry/resources/io close the reference
# because all three describe mechanisms other categories already depend on
# (custom stage registration, language-asset lookup, the Workflow save/load
# binary format) rather than new primary surface of their own.
#
# Two things worth flagging up front:
#   - `nodeb.h`'s own headers spell every type with the internal `nodeb`
#     name; public prose and every signature in this reference use the
#     confirmed public alias `pluss::ai::nlp` instead, and never repeat the
#     literal word "nodeb" anywhere (lint enforces this as a forbidden
#     term). The one exception is `classic::*` types `vectorize`/`embed`/
#     `runtime` borrow by value (`Status`/`StatusOr`/`FeatureBatch`/
#     `SparseTripletMatrix`/`LexiconMapper`/`HashMapper`/...) -- those are
#     genuinely `pluss::ai::classic`'s own public surface (the public alias
#     for the internal `nodej` name), confirmed via
#     `namespace classic = ::pluss::ai::nodej;` in `PlussAI/include/pluss/
#     ai/ml.h`, and are presented as `classic::*` throughout.
#   - Every `pluss::msharp::RangeView::Of<T>` parameter in the raw headers
#     is presented as the public spelling `pluss::RangeView<T>` instead,
#     per the standing doc-standards rule against leaking
#     `pluss::msharp::rangeview` into public docs.
#
# Hub-vs-self-contained choices (per the lymph doc standards' own
# distinction): `Doc`, `Lexicon`, `IStage`, `Workflow`, `Mapper`, `Hasher`,
# `Embedder`, `ContextualEmbedder`, `Indexer`, `EmbeddingTable`,
# `TransformerTextEncoder`, `LstmTextEncoder`, and `StageRegistry` are hubs
# (substantial, directly-called public surface -- `methods` non-empty, one
# page per method, each held to the full 3-example-minimum). `TextPool`,
# `MorphBank`, and `SequenceBatch` are self-contained (minor utility
# surface, `methods = []`, folded onto one page as `## Methods`
# subsections). The 8 stage classes in `tasks` (`RuleTokenizerStage`,
# `SentencizerStage`, `LemmatizerStage`, `MatcherStage`, `TaggerStage`,
# `SyntaxStage`, `NerStage`, `TextCatStage`) are also self-contained --
# each one's own page covers construction (via its `stage::` factory),
# its options, and worked `apply`/`learn`/persistence examples as prose
# sections, rather than exploding into near-duplicate per-method pages
# across all eight.

[framework.nlp]
title = "nlp"
summary = "PlussAI text/NLP engine: pipeline-first document processing, a stage catalog, classical and deep text vectorization, and neural embedding and sequence tooling built on nn."
include = "<pluss/nlp.h>"
header = "PlussAI"

