[[symbol]]
qualname = "pluss::ai::nlp::resources::is_abbreviation"
kind = "function"
family = "nlp/resources"
page = "api/nlp/resources/is_abbreviation.md"
summary = "Reports whether a token is a known sentence-ending abbreviation in a given Language, consulted by SentencizerStage before breaking a sentence on a period."
overloads = 1

[[symbol]]
qualname = "pluss::ai::nlp::resources::is_title"
kind = "function"
family = "nlp/resources"
page = "api/nlp/resources/is_title.md"
summary = "Reports whether a token is a known honorific/title in a given Language, consulted by SentencizerStage so \"Dr. Smith\" is not mistaken for a sentence boundary."
overloads = 1

[[symbol]]
qualname = "pluss::ai::nlp::resources::lookup_lemma"
kind = "function"
family = "nlp/resources"
page = "api/nlp/resources/lookup_lemma.md"
summary = "Looks a surface form up directly in a Language's bundled lemma table, returning an empty string on a miss -- the table LemmatizerStage consults before its rule-based fallback."
overloads = 1

[[symbol]]
qualname = "pluss::ai::nlp::resources::try_merge_token_exception"
kind = "function"
family = "nlp/resources"
page = "api/nlp/resources/try_merge_token_exception.md"
summary = "Checks whether two adjacent surface forms match one of a Language's bundled TokenMergeRules, writing the merged spelling and returning true on a hit."
overloads = 1

