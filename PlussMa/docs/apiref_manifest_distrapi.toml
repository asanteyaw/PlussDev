[[symbol]]
qualname = "pluss::subsp::stats::distr::Distribution"
kind = "class"
family = "distr/object_based"
page = "api/distr/object_based/Distribution.md"
summary = "The generic object for every dst::Kind, with delegated evaluation and sampling plus numerical cumulants and maximum-likelihood fitting."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::distr::Cauchy"
kind = "function"
family = "distr/continuous_real_line"
page = "api/distr/continuous_real_line/Cauchy.md"
summary = "The Cauchy distribution: a symmetric bell-shaped curve with tails so heavy that it has no mean and no variance."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::distr::ExtremeValue"
kind = "function"
family = "distr/continuous_real_line"
page = "api/distr/continuous_real_line/ExtremeValue.md"
summary = "The extreme value (Gumbel) distribution: the distribution of the largest of many independent observations of a variable with an exponential-type tail."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::distr::Gh"
kind = "function"
family = "distr/continuous_real_line"
page = "api/distr/continuous_real_line/Gh.md"
summary = "The generalised hyperbolic distribution: a five-parameter family that contains the normal inverse Gaussian, the hyperbolic, the variance-gamma and, in a limit, the Student t."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::distr::HyperbolicSecant"
kind = "function"
family = "distr/continuous_real_line"
page = "api/distr/continuous_real_line/HyperbolicSecant.md"
summary = "The hyperbolic secant distribution: a symmetric density proportional to the hyperbolic secant, between the normal and the logistic in tail weight."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::distr::Laplace"
kind = "function"
family = "distr/continuous_real_line"
page = "api/distr/continuous_real_line/Laplace.md"
summary = "The Laplace (double-exponential) distribution: a symmetric peak with exponentially decaying tails, the distribution of the error whose best estimate is the median."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::distr::Logistic"
kind = "function"
family = "distr/continuous_real_line"
page = "api/distr/continuous_real_line/Logistic.md"
summary = "The logistic distribution: a bell-shaped curve slightly heavier-tailed than the normal, whose distribution function is the logistic (sigmoid) function."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::distr::Nig"
kind = "function"
family = "distr/continuous_real_line"
page = "api/distr/continuous_real_line/Nig.md"
summary = "The normal inverse Gaussian distribution: a four-parameter family for skewed, heavy-tailed data."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::distr::Normal"
kind = "function"
family = "distr/continuous_real_line"
page = "api/distr/continuous_real_line/Normal.md"
summary = "The normal (Gaussian) distribution: the bell curve, determined by its mean and standard deviation."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::distr::StudentT"
kind = "function"
family = "distr/continuous_real_line"
page = "api/distr/continuous_real_line/StudentT.md"
summary = "The Student t distribution: a bell-shaped curve with heavier tails than the normal, controlled by its degrees of freedom."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::distr::TukeyLambda"
kind = "function"
family = "distr/continuous_real_line"
page = "api/distr/continuous_real_line/TukeyLambda.md"
summary = "The Tukey lambda distribution: a one-parameter family defined through its quantile function that contains the logistic, uniform and approximately the normal and heavy-tailed distributions."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::distr::GaussianMixture"
kind = "class"
family = "distr/object_based"
page = "api/distr/object_based/GaussianMixture.md"
