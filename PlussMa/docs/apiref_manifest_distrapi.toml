[[symbol]]
qualname = "pluss::subsp::stats::distr::Chi"
kind = "function"
family = "distr/continuous_positive"
page = "api/distr/continuous_positive/Chi.md"
summary = "The chi distribution: the distribution of the length of a vector of independent standard normal variables."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::distr::ChiSquare"
kind = "function"
family = "distr/continuous_positive"
page = "api/distr/continuous_positive/ChiSquare.md"
