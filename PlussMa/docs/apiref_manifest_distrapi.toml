[[symbol]]
qualname = "pluss::subsp::stats::distr::InverseGaussian"
kind = "function"
family = "distr/continuous_positive"
page = "api/distr/continuous_positive/InverseGaussian.md"
summary = "The inverse Gaussian distribution: the distribution of the first time a Brownian motion with positive drift reaches a fixed level."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::distr::Lognormal"
kind = "function"
family = "distr/continuous_positive"
page = "api/distr/continuous_positive/Lognormal.md"
summary = "The lognormal distribution: the distribution of a variable whose logarithm is normal, the standard model of multiplicative growth."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::distr::Lomax"
kind = "function"
family = "distr/continuous_positive"
page = "api/distr/continuous_positive/Lomax.md"
