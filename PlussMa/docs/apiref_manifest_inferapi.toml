# apiref_manifest_inferapi.toml -- the `infer` API reference of PlussMa.

[framework.infer_api]
title = "Inference"
nav_title = "Inference API"
nav_prefix = "api/infer/"
root_page = "api/plussma_infer.html"
summary = "Hypothesis tests: means, variances, ranks, distributions, groups and tables."
include = "<pluss/ma.h>"
header = ""

[[family]]
path = "infer/means_and_variances"
page = "api/infer/means_and_variances.md"
title = "means_and_variances"
maxdepth = 2
children = ["means_and_variances/ttest", "means_and_variances/ttest_paired", "means_and_variances/ttest2", "means_and_variances/ztest", "means_and_variances/vartest", "means_and_variances/vartest2", "means_and_variances/f_ratio"]

[[family]]
path = "infer/ranks_and_signs"
page = "api/infer/ranks_and_signs.md"
title = "ranks_and_signs"
maxdepth = 2
children = ["ranks_and_signs/ranksum", "ranks_and_signs/signrank", "ranks_and_signs/signtest"]

[[family]]
path = "infer/distributions"
page = "api/infer/distributions.md"
title = "distributions"
maxdepth = 2
children = ["distributions/kstest", "distributions/kstest2", "distributions/jbtest"]

[[family]]
path = "infer/groups_and_tables"
page = "api/infer/groups_and_tables.md"
title = "groups_and_tables"
maxdepth = 2
children = ["groups_and_tables/anova_1w", "groups_and_tables/chisq_gof", "groups_and_tables/chisq_indep"]

[[symbol]]
qualname = "pluss::subsp::stats::inference::hypothesis::ttest"
kind = "function"
family = "infer/means_and_variances"
page = "api/infer/means_and_variances/ttest.md"
summary = "One-sample Student t-test of a mean."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::inference::hypothesis::ttest_paired"
kind = "function"
family = "infer/means_and_variances"
page = "api/infer/means_and_variances/ttest_paired.md"
summary = "Paired-sample t-test: is the mean difference of matched pairs zero?"
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::inference::hypothesis::ttest2"
kind = "function"
family = "infer/means_and_variances"
page = "api/infer/means_and_variances/ttest2.md"
summary = "Two-sample t-test for the means of two independent samples, pooled or Welch."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::inference::hypothesis::ztest"
kind = "function"
family = "infer/means_and_variances"
page = "api/infer/means_and_variances/ztest.md"
summary = "One-sample z-test of a mean when the standard deviation is known."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::inference::hypothesis::vartest"
kind = "function"
family = "infer/means_and_variances"
page = "api/infer/means_and_variances/vartest.md"
