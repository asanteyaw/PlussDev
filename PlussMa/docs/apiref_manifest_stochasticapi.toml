# apiref_manifest_stochasticapi.toml -- the `Stochastic processes` API reference of PlussMa.

[framework.stochastic_api]
title = "Stochastic processes"
nav_title = "Stochastic processes API"
nav_prefix = "api/stochastic/"
root_page = "api/plussma_stochastic.html"
summary = "Stochastic differential equation simulation, stochastic integrals along explicit Wiener paths, and jump paths."
include = "<pluss/ma.h>"
header = ""

[[family]]
path = "stochastic/sde"
page = "api/stochastic/sde.md"
title = "Stochastic differential equations"
maxdepth = 2
children = ["sde/SdeAdjointResult", "sde/SdeMethod", "sde/SdeOptions", "sde/SdeResult", "sde/fluctua", "sde/fluctua_adjoint"]

[[family]]
path = "stochastic/integrals"
page = "api/stochastic/integrals.md"
title = "Stochastic integrals and jump paths"
maxdepth = 2
children = ["integrals/AdaptednessOptions", "integrals/JumpPath", "integrals/StochasticIntegralResult", "integrals/WienerPath", "integrals/ito_integral", "integrals/marcus_integral", "integrals/simulate_jump_diffusion_path", "integrals/simulate_wiener_path", "integrals/strat_integral"]

[[symbol]]
qualname = "sde::SdeMethod"
kind = "options"
family = "stochastic/sde"
page = "api/stochastic/sde/SdeMethod.md"
summary = "The time-stepping scheme of `fluctua`: Euler-Maruyama, Milstein or Stratonovich-Heun."
fields = ["EulerMaruyama", "Milstein", "StratonovichHeun"]

[[symbol]]
qualname = "sde::SdeOptions"
kind = "options"
family = "stochastic/sde"
page = "api/stochastic/sde/SdeOptions.md"
summary = "The scheme, the number of steps and the seed of a simulation."
fields = ["method", "steps", "seed"]

[[symbol]]
qualname = "sde::SdeResult"
kind = "options"
family = "stochastic/sde"
page = "api/stochastic/sde/SdeResult.md"
summary = "The state at the end time and the realised Wiener increment of a simulation."
fields = ["y_final", "wiener_final", "steps", "converged"]

[[symbol]]
qualname = "sde::fluctua"
kind = "function"
family = "stochastic/sde"
page = "api/stochastic/sde/fluctua.md"
summary = "Simulates `dY = μ(t, Y, θ) dt + σ(t, Y, θ) dW` from `t0` to `t1` for one path or a batch and returns the end state."
overloads = 1

[[symbol]]
qualname = "sde::SdeAdjointResult"
kind = "options"
family = "stochastic/sde"
page = "api/stochastic/sde/SdeAdjointResult.md"
summary = "The end state of a simulation and the pathwise gradients of a loss with respect to the initial state and the parameters."
fields = ["y_final", "wiener_final", "grad_y0", "grad_theta", "forward_steps", "backward_steps"]

[[symbol]]
qualname = "sde::fluctua_adjoint"
kind = "function"
family = "stochastic/sde"
page = "api/stochastic/sde/fluctua_adjoint.md"
summary = "Differentiates a simulation backwards: the pathwise gradients of a loss of the end state with respect to the initial state and the parameters."
overloads = 2
toggles = ["loss form", "seed form"]

[[symbol]]
qualname = "sde::simulate_wiener_path"
kind = "function"
family = "stochastic/integrals"
page = "api/stochastic/integrals/simulate_wiener_path.md"
summary = "Simulates standard Wiener paths on an equal grid and returns them with their times."
overloads = 1

[[symbol]]
qualname = "sde::WienerPath"
kind = "options"
family = "stochastic/integrals"
page = "api/stochastic/integrals/WienerPath.md"
summary = "A sampled path with its time grid: the data that the stochastic integrals integrate against."
fields = ["w", "times", "t0", "t1", "steps"]

[[symbol]]
qualname = "sde::StochasticIntegralResult"
kind = "options"
family = "stochastic/integrals"
page = "api/stochastic/integrals/StochasticIntegralResult.md"
summary = "The value of a stochastic integral together with the realised quadratic variation of its path and any warnings."
fields = ["value", "realized_quadratic_variation", "quadratic_variation_ratio", "warnings"]

[[symbol]]
qualname = "sde::ito_integral"
kind = "function"
family = "stochastic/integrals"
page = "api/stochastic/integrals/ito_integral.md"
summary = "The Itô integral `∫ f dW` of an integrand along an explicit path, with the integrand read at the start of each step."
overloads = 2
toggles = ["pointwise", "sampled path"]

[[symbol]]
qualname = "sde::strat_integral"
kind = "function"
family = "stochastic/integrals"
page = "api/stochastic/integrals/strat_integral.md"
summary = "The Stratonovich integral `∫ f ∘ dW`, with the integrand averaged over both ends of each step."
overloads = 2
toggles = ["pointwise", "sampled path"]

[[symbol]]
qualname = "sde::AdaptednessOptions"
kind = "options"
family = "stochastic/integrals"
page = "api/stochastic/integrals/AdaptednessOptions.md"
summary = "How hard the sampled-path integral forms probe an integrand for dependence on the future."
fields = ["probes", "seed", "tolerance"]

[[symbol]]
qualname = "sde::simulate_jump_diffusion_path"
kind = "function"
family = "stochastic/integrals"
page = "api/stochastic/integrals/simulate_jump_diffusion_path.md"
summary = "Simulates a path with Brownian increments and compound-Poisson jumps, the driver of a jump-diffusion."
overloads = 1

[[symbol]]
qualname = "sde::JumpPath"
kind = "options"
family = "stochastic/integrals"
page = "api/stochastic/integrals/JumpPath.md"
summary = "A path with jumps together with the mask of the steps that contain one."
fields = ["path", "jump_mask"]

[[symbol]]
qualname = "sde::marcus_integral"
kind = "function"
family = "stochastic/integrals"
page = "api/stochastic/integrals/marcus_integral.md"
summary = "The Marcus (canonical) integral `∫ f ∘ dX` along a path with jumps."
overloads = 2
toggles = ["explicit mask", "detected jumps"]

