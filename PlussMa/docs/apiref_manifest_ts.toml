# apiref_manifest_ts.toml -- the `ts` framework of PlussMa.

[framework.ts]
title = "ts"
summary = "Time series: transforms, diagnostics, ARIMA, volatility, vector, state-space and direct forecasting models."
include = "<pluss/ma.h>"
header = "PlussMa/include/pluss/subsp/stats/ts.h"

[[family]]
path = "ts/transforms"
page = "api/ts/transforms.md"
title = "transforms"
maxdepth = 2
children = ["transforms/diff", "transforms/ema", "transforms/ewm_mean", "transforms/ewm_std", "transforms/expanding_mean", "transforms/expanding_std", "transforms/fill_gaps", "transforms/lag", "transforms/lead", "transforms/log_returns", "transforms/resample", "transforms/returns", "transforms/rolling_max", "transforms/rolling_mean", "transforms/rolling_min", "transforms/rolling_std", "transforms/rolling_sum", "transforms/rolling_var", "transforms/zscore_rolling"]

[[family]]
path = "ts/diagnostics"
page = "api/ts/diagnostics.md"
title = "diagnostics"
maxdepth = 2
children = ["diagnostics/acf", "diagnostics/AcfOptions", "diagnostics/adf_test", "diagnostics/AdfOptions", "diagnostics/AdfResult", "diagnostics/arch_lm", "diagnostics/ArchLmOptions", "diagnostics/ArchLmResult", "diagnostics/kpss_test", "diagnostics/KpssOptions", "diagnostics/KpssResult", "diagnostics/ljung_box", "diagnostics/LjungBoxOptions", "diagnostics/LjungBoxResult", "diagnostics/pacf", "diagnostics/PacfOptions"]

[[family]]
path = "ts/arima"
page = "api/ts/arima.md"
title = "arima"
maxdepth = 2
children = ["arima/Arima", "arima/ArimaFit", "arima/ArimaOptions", "arima/Sarima", "arima/SarimaFit", "arima/SarimaOptions"]

[[family]]
path = "ts/volatility"
page = "api/ts/volatility.md"
title = "volatility"
maxdepth = 2
children = ["volatility/Egarch", "volatility/EgarchFit", "volatility/EgarchOptions", "volatility/Garch", "volatility/Garch11", "volatility/Garch11Fit", "volatility/Garch11Options", "volatility/GarchFit", "volatility/GarchOptions", "volatility/Gjr", "volatility/GjrFit", "volatility/GjrOptions", "volatility/MvEgarch", "volatility/MvEgarchFit", "volatility/MvEgarchOptions", "volatility/MvGarch", "volatility/MvGarchFit", "volatility/MvGarchOptions", "volatility/MvGjr", "volatility/MvGjrFit", "volatility/MvGjrOptions"]

[[family]]
path = "ts/vector"
page = "api/ts/vector.md"
title = "vector"
maxdepth = 2
children = ["vector/FevdOptions", "vector/GrangerOptions", "vector/GrangerResult", "vector/IrfOptions", "vector/johansen_test", "vector/JohansenOptions", "vector/JohansenResult", "vector/Var", "vector/var_to_vecm", "vector/VarFit", "vector/VarOptions", "vector/Vecm", "vector/vecm_to_var", "vector/VecmFit", "vector/VecmOptions"]

[[family]]
path = "ts/statespace"
page = "api/ts/statespace.md"
title = "statespace"
maxdepth = 2
children = ["statespace/Ssm", "statespace/SsmFilterResult", "statespace/SsmForecastResult", "statespace/SsmModel", "statespace/SsmOptions", "statespace/SsmSimResult", "statespace/SsmSmoothResult"]

[[family]]
path = "ts/forecasting"
page = "api/ts/forecasting.md"
title = "forecasting"
maxdepth = 2
children = ["forecasting/build_lag_plan", "forecasting/build_lagged_predictors", "forecasting/DirectCVForecaster", "forecasting/DirectForecaster", "forecasting/DirectForecasterOptions", "forecasting/DirectStepModel", "forecasting/dm_test", "forecasting/DmOptions", "forecasting/DmResult", "forecasting/LagPlan", "forecasting/LagPlanOptions", "forecasting/PartitionOptions", "forecasting/PartitionWindow", "forecasting/TsPartition"]

[[family]]
path = "ts/plot"
page = "api/ts/plot.md"
title = "plot"
maxdepth = 2
children = ["plot/CorrPlotOptions", "plot/CorrPlotPayload", "plot/plot_acf", "plot/plot_acf_payload", "plot/plot_pacf", "plot/plot_pacf_payload", "plot/plot_residuals", "plot/plot_residuals_payload", "plot/ResidualPlotOptions", "plot/ResidualPlotPayload"]

[[symbol]]
qualname = "pluss::subsp::stats::ts::diff"
kind = "function"
family = "ts/transforms"
page = "api/ts/transforms/diff.md"
summary = "The first difference of a series: each observation minus the one `periods` positions earlier."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::returns"
kind = "function"
family = "ts/transforms"
page = "api/ts/transforms/returns.md"
summary = "The simple return of a series: the relative change over `periods` observations."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::log_returns"
kind = "function"
family = "ts/transforms"
page = "api/ts/transforms/log_returns.md"
summary = "The logarithmic return of a series: the natural log of the ratio of an observation to the one `periods` earlier."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::lag"
kind = "function"
family = "ts/transforms"
page = "api/ts/transforms/lag.md"
summary = "The series shifted later in time: position `t` holds the observation from `periods` steps earlier."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::lead"
kind = "function"
family = "ts/transforms"
page = "api/ts/transforms/lead.md"
summary = "The series shifted earlier in time: position `t` holds the observation from `periods` steps later."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::rolling_mean"
kind = "function"
family = "ts/transforms"
page = "api/ts/transforms/rolling_mean.md"
summary = "The mean of each window of `window` consecutive observations."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::rolling_sum"
kind = "function"
family = "ts/transforms"
page = "api/ts/transforms/rolling_sum.md"
summary = "The sum of each window of `window` consecutive observations."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::rolling_std"
kind = "function"
family = "ts/transforms"
page = "api/ts/transforms/rolling_std.md"
summary = "The standard deviation of each window of `window` consecutive observations."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::rolling_var"
