[[symbol]]
qualname = "pluss::subsp::stats::ts::ewm_std"
kind = "function"
family = "ts/transforms"
page = "api/ts/transforms/ewm_std.md"
summary = "The exponentially weighted standard deviation of a series."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::expanding_mean"
kind = "function"
family = "ts/transforms"
page = "api/ts/transforms/expanding_mean.md"
summary = "The mean of all observations up to each position."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::expanding_std"
kind = "function"
family = "ts/transforms"
page = "api/ts/transforms/expanding_std.md"
summary = "The standard deviation of all observations up to each position."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::zscore_rolling"
kind = "function"
family = "ts/transforms"
page = "api/ts/transforms/zscore_rolling.md"
summary = "The rolling z-score: each observation minus the window mean, divided by the window standard deviation."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::fill_gaps"
kind = "function"
family = "ts/transforms"
page = "api/ts/transforms/fill_gaps.md"
summary = "Replaces missing values (`NaN`) in a series by carrying values forward or backward, or by a constant."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::resample"
kind = "function"
family = "ts/transforms"
page = "api/ts/transforms/resample.md"
summary = "Aggregates a time-indexed series into coarser time bins, such as days, weeks or months."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::acf"
kind = "function"
family = "ts/diagnostics"
page = "api/ts/diagnostics/acf.md"
summary = "The sample autocorrelation function of a series: its correlation with itself at lags 0 through `max_lag`."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::pacf"
kind = "function"
family = "ts/diagnostics"
page = "api/ts/diagnostics/pacf.md"
summary = "The sample partial autocorrelation function: the correlation at each lag that remains after removing the effect of the shorter lags."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::ljung_box"
kind = "function"
family = "ts/diagnostics"
page = "api/ts/diagnostics/ljung_box.md"
summary = "The Ljung–Box test that a series, or a model's residuals, is white noise up to a set of lags."
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::arch_lm"
kind = "function"
family = "ts/diagnostics"
page = "api/ts/diagnostics/arch_lm.md"
summary = "Engle's ARCH-LM test for volatility clustering: are the squared values of a series autocorrelated?"
overloads = 1

[[symbol]]
qualname = "pluss::subsp::stats::ts::adf_test"
kind = "function"
family = "ts/diagnostics"
page = "api/ts/diagnostics/adf_test.md"
