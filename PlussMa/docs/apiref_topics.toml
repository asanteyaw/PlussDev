# apiref_topics.toml -- the one list of PlussMa topics.
#
# Every topic has two sections: the User Guide (task-oriented chapters, programs with real
# output) and the API Reference (one page per function, type and option). This file is the only
# place that says which topics exist, in which order, and where each section starts; `apiref.py
# wire` reads it to generate the home-page cards, the User Guide and API Reference landing
# pages, and the Guide/Reference switch at the top of every sidebar. A section with no page yet
# is left out (`guide` / `reference` empty) and is shown as "coming".
#
#   slug       short name; also the manual/<slug>/ directory of the guide
#   title      what readers see
#   summary    one line, shared by the cards and both landing pages
#   guide      first page of the guide, relative to the docs root (md)
#   reference  first page of the API reference, relative to the docs root (md)
#   code       the namespace or framework name used in code, for the cards

[[topic]]
slug = "ts"
title = "Time series"
code = "ts"
summary = "Transforms, diagnostics, ARIMA, volatility, vector, state-space and direct forecasting models."
guide = "manual/ts/guide.md"
reference = "api/plussma_ts.md"

