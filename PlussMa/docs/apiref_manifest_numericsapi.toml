# apiref_manifest_numericsapi.toml -- the `Numerical methods` API reference of PlussMa.

[framework.numerics_api]
title = "Numerical methods"
nav_title = "Numerical methods API"
nav_prefix = "api/numerics/"
root_page = "api/plussma_numerics.html"
summary = "Numerical integration, differential equations, Krylov solvers and interpolation over Series data."
