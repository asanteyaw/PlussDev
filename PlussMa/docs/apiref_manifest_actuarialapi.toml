# apiref_manifest_actuarialapi.toml -- the actuarial mathematics API reference.

[framework.actuarial_api]
title = "Actuarial mathematics"
nav_title = "Actuarial API"
nav_prefix = "api/actuarial/"
root_page = "api/plussma_actuarial.html"
summary = "Typed actuarial operators for mortality, contingent cashflows, loss contracts, pricing and reserving."
include = "<pluss/ma.h>"
header = ""
min_examples = 3

