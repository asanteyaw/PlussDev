[[symbol]]
qualname = "roots::secant"
kind = "function"
family = "optim/roots"
page = "api/optim/roots/secant.md"
summary = "The secant method: Newton's idea without a derivative, using the line through the last two iterates."
overloads = 1

[[symbol]]
qualname = "roots::householder"
kind = "function"
family = "optim/roots"
page = "api/optim/roots/householder.md"
summary = "Fourth-order Householder iteration, given the function and its first three derivatives; the root is differentiable with respect to anything the function captures."
overloads = 1

