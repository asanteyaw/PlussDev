[[symbol]]
qualname = "roots::bisect"
kind = "function"
family = "optim/roots"
page = "api/optim/roots/bisect.md"
summary = "Finds a root of `f` in a bracket by repeatedly halving the interval, for every lane at once."
overloads = 1

[[symbol]]
qualname = "roots::illinois"
kind = "function"
family = "optim/roots"
page = "api/optim/roots/illinois.md"
summary = "Finds a root in a bracket by regula falsi with the Illinois modification: bracketed like bisection, but superlinear."
overloads = 1

[[symbol]]
qualname = "roots::newton"
kind = "function"
family = "optim/roots"
page = "api/optim/roots/newton.md"
summary = "Newton–Raphson iteration from a starting value, with an analytic derivative or a finite-difference slope."
