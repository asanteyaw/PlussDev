# Intent layer for public_calls.md (read by generate_public_calls.rb).
#
# clang-doc reports every non-private, non-`detail` declaration in the umbrella headers, which cannot tell a deliberate API from a helper that
# merely sits at namespace scope. This file records the author's intent for the NatSci code written by the biology/chemistry track:
#   internal:    symbols that stay out of API prose (helpers, validators, unit-constant accessors, building blocks without a user story),
#                keyed by header (path below include/pluss/subsp/natsci/) and unqualified name, with the reason.
#   front_doors: the calls a user is meant to start from, per module namespace (shown first in the generated file).
# A header that is not listed under `internal` has every reported symbol treated as intended public. New work: add its internals and front doors here
# in the same commit that adds the header, then regenerate.

internal:
  - header: biology/biophysics/protein_folding.h
    names: [gas_constant_kcal, rt_kcal]
    reason: unit helpers (R in kcal/mol/K and RT); callers pass temperatures to the model functions
  - header: biology/biophysics/nucleic_acids.h
    names: [table]
    reason: internal lookup into the generated nearest-neighbor tables; the supported entry is duplex_thermodynamics
  - header: biology/population/birth_death.h
    names: [normal_cdf]
    reason: numeric helper for quasi_extinction_cdf
  - header: biology/population/delay.h
    names: [Complex, lambert_w0_complex]
    reason: building block of rightmost_root (complex Lambert W as real/imaginary Series pair); not a supported standalone special function
  - header: biology/biomechanics/hemodynamics.h
    names: [cmul, cdiv, csub, cscale, cexp]
    reason: complex-arithmetic helpers on (re, im) Series pairs; results are exposed through the Womersley / impedance calls
  - header: biology/metabolism/fba.h
    names: [validate]
    reason: argument checker run by the solvers
  - header: biology/metabolism/pathway_thermodynamics.h
    names: [gas_constant_kj]
    reason: unit helper
  - header: biology/metabolism/thermodynamics.h
    names: [gas_constant]
    reason: unit helper
  - header: biology/genetics/wright_fisher.h
    names: [sample_binomial]
    reason: sampling kernel of simulate(); not a distribution API
  - header: common/dynamics.h
    names: [require, require_finite, require_float, require_nonnegative, require_positive, require_species, require_square, matvec, prod_last]
    reason: argument validators and small tensor helpers shared by the models; not part of the modelling API
  - header: common/reaction.h
    names: [positive_products]
    reason: log-space power kernel used inside flux/propensity
  - header: chemistry/crystallization.h
    names: [boltzmann, driving_force, growth_rate, birth_rate]
    reason: constant accessor and kinetic sub-expressions of the MSMPR equations (use moment_rate / pbe_rate / steady_state)
  - header: chemistry/rate_theory.h
    names: [planck, boltzmann, avogadro, gas_constant, light_speed_cm, wavenumber_to_joule, eyring_prefactor]
    reason: constant accessors and unit factors (physical constants are documented under common::constants)
  - header: chemistry/spectroscopy.h
    names: [avogadro, boltzmann, speed_of_light]
    reason: constant accessors; physical constants are documented under common::constants
  - header: chemistry/transport.h
    names: [avogadro, boltzmann]
    reason: constant accessors
  - header: chemistry/thermo.h
    names: [gas_constant]
    reason: constant accessor
  - header: common/electrochem.h
    names: [faraday, gas_constant]
    reason: constant accessors

