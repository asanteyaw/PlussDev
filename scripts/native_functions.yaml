- func: _fused_adam_(Series(a!)[] self, Series(b!)[] grads, Series(c!)[] exp_avgs, Series(d!)[] exp_avg_sqs, Series(e!)[] max_exp_avg_sqs, Series[] state_steps, *, float lr, float beta1, float beta2, float weight_decay, float eps, bool amsgrad, bool maximize, Series? grad_scale=None, Series? found_inf=None) -> ()
  # Unlike "foreach" functions, lists of tensors should be guaranteed to be on the same device (for now).
  variants: function
  dispatch:
    CPU: _fused_adam_kernel_cpu_
    CUDA: _fused_adam_kernel_cuda_
    MPS: _fused_adam_kernel_mps_
  autogen: _fused_adam, _fused_adam.out

