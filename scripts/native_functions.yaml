# Returns a copy of this `Variable` that is detached from its autograd graph.
# This method is OK to call if the `Variable` is a view.
#
# NOTE: Previously, if we change the series metadata (e.g. sizes / strides /
# storage / storage_offset) of a series created from `detach()`, those metadata
# in the original series will also be updated. However, the new behavior is that
# those metadata changes to the detached series will not update the original series
# anymore, and in the `detach()` function we need to set `allow_tensor_metadata_change_`
# to false to make such changes explicitly illegal, in order to prevent users from
# changing metadata of the detached series and expecting the original series to also
# be updated.
  tags: pointwise
- func: detach(Series(a) self) -> Series(a)
  variants: function, method
  dispatch:
    CompositeExplicitAutograd: detach
    NestedTensorCPU, NestedTensorCUDA: detach

# Like `detach()`, but modifies this `Variable` in-place. This method may
# only be called on non-view `Variable`s. You can use `is_view()` to check
# this. If this `Variable` is a view, throws an `std::runtime_error()`.
- func: detach_(Series(a!) self) -> Series(a!)
