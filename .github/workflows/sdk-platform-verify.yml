name: PlussView Verification

on:
  push:
    branches:
      - main
      - 'validation/**'
    paths:
      - .github/workflows/sdk-platform-verify.yml
      - .github/actions/**
      - CMakeLists.txt
      - cmake/**
      - PlussAI/**
      - PlussMa/**
      - PlussMic/**
      - PlussPl/**
      - PlussQit/**
      - PlussTils/**
      - include/**
      - pluss/**
      - examples/sdk_consumer/**
  pull_request:
    paths:
      - .github/workflows/sdk-platform-verify.yml
      - .github/actions/**
      - CMakeLists.txt
      - cmake/**
      - PlussAI/**
      - PlussMa/**
      - PlussMic/**
      - PlussPl/**
      - PlussQit/**
      - PlussTils/**
      - include/**
      - pluss/**
      - examples/sdk_consumer/**
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to verify
        type: choice
        default: all
        options:
          - all
          - windows
          - unix

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/validation/') }}

jobs:
  verify-plussview:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.platform == 'windows' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/validation/'))) && '["windows-2022"]' || (inputs.platform == 'unix' && '["ubuntu-24.04","macos-15"]' || '["ubuntu-24.04","windows-2022","macos-15"]')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          # Sparse checkout omits generated build files with Windows-reserved names.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
        with:
          sparse-checkout: |
            PlussAI
            PlussMa
            PlussMic
            PlussPl
            PlussQit
            PlussTils
            .github/actions
            ExLibs
            cmake
            docs
            examples
            include
            pluss
            tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies (curl, X11 window tests, screenshots)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libx11-dev libxi-dev libfreetype-dev xvfb x11-apps imagemagick

      - name: Build static native dependencies
        uses: ./.github/actions/native-deps

      # The same configuration the release archives are built with, plus the tests.
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Quote every -D value: an unquoted -DX=$env:Y reaches CMake as the literal text "$env:Y".
          cmake -S . -B build -T ClangCL -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DPLUSSQIT_BUILD_TESTS=OFF -DPLUSSQIT_BUILD_EXAMPLES=OFF -DPLUSSMIC_FETCH_CURL=OFF -DPLUSSMIC_REQUIRE_CURL=ON -DPLUSSMIC_BUNDLE_NATIVE_DEPS=ON -DPLUSSMIC_REQUIRE_EXCEL=ON -DPLUSSMIC_REQUIRE_PARQUET=ON "-DVCPKG_TARGET_TRIPLET=$env:PLUSSII_VCPKG_TRIPLET" "-DCMAKE_TOOLCHAIN_FILE=$env:PLUSSII_VCPKG_TOOLCHAIN"

      - name: Configure macOS and Ubuntu
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DPLUSSQIT_BUILD_TESTS=OFF -DPLUSSQIT_BUILD_EXAMPLES=OFF -DPLUSSMIC_FETCH_CURL=OFF -DPLUSSMIC_REQUIRE_CURL=ON -DPLUSSMIC_BUNDLE_NATIVE_DEPS=ON -DPLUSSMIC_REQUIRE_EXCEL=ON -DPLUSSMIC_REQUIRE_PARQUET=ON -DVCPKG_TARGET_TRIPLET=$PLUSSII_VCPKG_TRIPLET -DCMAKE_TOOLCHAIN_FILE=$PLUSSII_VCPKG_TOOLCHAIN -DPLUSSQIT_ENABLE_MPS=OFF

      - name: Build PlussView tests
        id: build
        run: cmake --build build --config Release --target plussview_html_table_layout_tests plussview_html_scroll_tests plussview_async_compositor_tests plussview_window_smoke --parallel 2

      # Layout, sizing, resizing, sort arrows and the PDF writer: no window needed.
      - name: Run PlussView table layout tests
        run: ctest --test-dir build -C Release -R "plussview_html_table_layout_tests" --output-on-failure

      # The older scroll and compositor suites. They run as their own step so that one of them failing
      # does not hide whether the table checks and the window smoke below pass.
      - name: Run PlussView scroll and compositor tests
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: ctest --test-dir build -C Release -R "plussview_(html_scroll|async_compositor)_tests" --output-on-failure

      # A real window: the viewer shows a table and writes the PNG and PDF that Save As would.
      - name: Table window and export smoke (Linux, under a virtual display)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && runner.os == 'Linux' }}
        run: |
          mkdir -p smoke
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            build/PlussTils/view/plussview_window_smoke smoke &
            smoke_pid=$!
            sleep 3
            xwd -root -silent | convert xwd:- smoke/window-with-toolbar.png || true
            wait $smoke_pid'

      - name: Table window and export smoke (Windows)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && runner.os == 'Windows' }}
        shell: pwsh
        run: '& "build/PlussTils/view/Release/plussview_window_smoke.exe" smoke'

      - name: Table window and export smoke (macOS)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && runner.os == 'macOS' }}
        run: build/PlussTils/view/plussview_window_smoke smoke

      - name: Upload exports and window screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plussview-smoke-${{ matrix.os }}
          path: smoke/*
          if-no-files-found: warn
