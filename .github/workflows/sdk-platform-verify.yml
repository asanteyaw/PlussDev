name: SDK Platform Verification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sdk-platform-verify.yml
      - CMakeLists.txt
      - cmake/**
      - PlussAI/**
      - PlussMa/**
      - PlussMic/**
      - PlussPl/**
      - PlussQit/**
      - PlussTils/**
      - include/**
      - pluss/**
      - examples/sdk_consumer/**
  pull_request:
    paths:
      - .github/workflows/sdk-platform-verify.yml
      - CMakeLists.txt
      - cmake/**
      - PlussAI/**
      - PlussMa/**
      - PlussMic/**
      - PlussPl/**
      - PlussQit/**
      - PlussTils/**
      - include/**
      - pluss/**
      - examples/sdk_consumer/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CMake version
        run: cmake --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPLUSSQIT_BUILD_TESTS=OFF -DPLUSSQIT_BUILD_EXAMPLES=OFF

      - name: Stage distribution
        run: cmake --build build --config Release --target pluss_sdk_stage --parallel 2

      - name: Package and validate downloadable ZIP
        run: cmake "-DSDK_BUILD_DIR=${{ github.workspace }}/build" "-DSDK_SOURCE_DIR=${{ github.workspace }}" -P cmake/VerifyStagedSdk.cmake
