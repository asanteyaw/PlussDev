name: PlussII Distribution Verification

on:
  push:
    branches:
      - main
      - renderer-parity-*
    paths:
      - .github/workflows/sdk-platform-verify.yml
      - CMakeLists.txt
      - cmake/**
      - PlussAI/**
      - PlussMa/**
      - PlussMic/**
      - PlussPl/**
      - PlussQit/**
      - PlussTils/**
      - include/**
      - pluss/**
      - examples/sdk_consumer/**
  pull_request:
    paths:
      - .github/workflows/sdk-platform-verify.yml
      - CMakeLists.txt
      - cmake/**
      - PlussAI/**
      - PlussMa/**
      - PlussMic/**
      - PlussPl/**
      - PlussQit/**
      - PlussTils/**
      - include/**
      - pluss/**
      - examples/sdk_consumer/**
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to verify
        type: choice
        default: all
        options:
          - all
          - windows

permissions:
  contents: read

jobs:
  verify-distribution:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-2022"]' || '["ubuntu-24.04","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          # Generated build_cpp_env artifacts still contain Windows-reserved
          # names. Sparse checkout omits them; disable Git's whole-tree path
          # rejection so it can materialize the selected source directories.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
        with:
          sparse-checkout: |
            PlussAI
            PlussMa
            PlussMic
            PlussPl
            PlussQit
            PlussTils
            ExLibs
            cmake
            docs
            examples
            include
            pluss
            tools

      - name: Check CMake version
        run: cmake --version

      - name: Install Windows SQLite3
        if: runner.os == 'Windows'
        run: vcpkg install sqlite3:x64-windows-static

      - name: Install Linux window test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxi-dev libfreetype-dev xvfb

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -T ClangCL -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPLUSSQIT_BUILD_TESTS=OFF -DPLUSSQIT_BUILD_EXAMPLES=OFF -DVCPKG_TARGET_TRIPLET=x64-windows-static "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Configure Ubuntu
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPLUSSQIT_BUILD_TESTS=OFF -DPLUSSQIT_BUILD_EXAMPLES=OFF

      - name: Stage distribution
        run: cmake --build build --config Release --target plussii_distribution_stage --parallel 2

      - name: Build built-in table and plot renderer smoke
        run: cmake --build build --config Release --target plusstils_view_platform_show_smoke --parallel 2

      - name: Verify Linux table and plot windows
        if: runner.os == 'Linux'
        run: xvfb-run -a build/PlussTils/view/plusstils_view_platform_show_smoke build/renderer-show-smoke --window

      - name: Verify Windows table and plot windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "build/PlussTils/view/Release/plusstils_view_platform_show_smoke.exe" "build/renderer-show-smoke" --window'

      - name: Upload renderer snapshots
        uses: actions/upload-artifact@v4
        with:
          name: plussii-renderer-${{ matrix.os }}-verify
          path: build/renderer-show-smoke/*.png
          if-no-files-found: error

      - name: Package and validate downloadable ZIP
        run: cmake "-DDISTRIBUTION_BUILD_DIR=${{ github.workspace }}/build" "-DDISTRIBUTION_SOURCE_DIR=${{ github.workspace }}" -P cmake/VerifyStagedDistribution.cmake

      - name: Upload validated ZIP
        uses: actions/upload-artifact@v4
        with:
          name: plussii-cpp-${{ matrix.os }}-verify
          path: build/plussii-cpp-*.zip
          if-no-files-found: error
