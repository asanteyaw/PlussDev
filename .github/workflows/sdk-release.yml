name: PlussII C++ Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build channel (Steady releases are published from version tags)
        type: choice
        default: transient
        options:
          - transient
  schedule:
    - cron: "23 4 * * *"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-archive:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          # Sparse checkout omits generated build files with Windows-reserved names.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
        with:
          sparse-checkout: |
            PlussAI
            PlussMa
            PlussMic
            PlussPl
            PlussQit
            PlussTils
            ExLibs
            cmake
            docs
            examples
            include
            pluss
            tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux curl development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        run: vcpkg install sqlite3:x64-windows-static curl:x64-windows-static

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -T ClangCL -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPLUSSQIT_BUILD_TESTS=OFF -DPLUSSQIT_BUILD_EXAMPLES=OFF -DPLUSSMIC_FETCH_CURL=OFF -DPLUSSMIC_REQUIRE_CURL=ON -DVCPKG_TARGET_TRIPLET=x64-windows-static "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Configure macOS and Ubuntu
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPLUSSQIT_BUILD_TESTS=OFF -DPLUSSQIT_BUILD_EXAMPLES=OFF -DPLUSSMIC_FETCH_CURL=OFF -DPLUSSMIC_REQUIRE_CURL=ON

      - name: Stage distribution
        run: cmake --build build --config Release --target plussii_distribution_stage --parallel 2

      - name: Package and validate downloadable ZIP
        run: cmake "-DDISTRIBUTION_BUILD_DIR=${{ github.workspace }}/build" "-DDISTRIBUTION_SOURCE_DIR=${{ github.workspace }}" -P cmake/VerifyStagedDistribution.cmake

      - name: Upload validated ZIP
        uses: actions/upload-artifact@v4
        with:
          name: plussii-cpp-${{ matrix.os }}
          path: build/plussii-cpp-*.zip
          if-no-files-found: error

  publish:
    needs: build-archive
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout version
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CMakeLists.txt
            docs/releases

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^project(plussma VERSION \([0-9][0-9.]*\) LANGUAGES CXX)/\1/p' CMakeLists.txt)"
          if [[ -z "$version" || "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match CMake version v${version}."
            exit 1
          fi

      - name: Download validated ZIPs
        uses: actions/download-artifact@v4
        with:
          pattern: plussii-cpp-*
          path: release-assets
          merge-multiple: true

      - name: Label Transient archives
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        working-directory: release-assets
        run: |
          shopt -s nullglob
          for archive in plussii-cpp-*.zip; do
            platform="${archive#plussii-cpp-}"
            platform="${platform#*-}"
            mv "$archive" "plussii-cpp-transient-${platform}"
          done

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum plussii-cpp-*.zip > SHA256SUMS.txt

      - name: Move Transient tag to validated source
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/transient" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/transient" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/transient' -f sha="$GITHUB_SHA"
          fi

      - name: Publish Steady release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/plussii-cpp-*.zip
            release-assets/SHA256SUMS.txt
          body_path: docs/releases/${{ github.ref_name }}.md
          make_latest: true

      - name: Publish Transient release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: transient
          name: PlussII Transient
          prerelease: true
          make_latest: false
          body: |
            Transient is the latest validated source build. It may change between Steady releases.
            All five archives passed their platform build and distribution checks for commit ${{ github.sha }}.
          files: |
            release-assets/plussii-cpp-*.zip
            release-assets/SHA256SUMS.txt
