name: PlussII C++ Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build channel (Steady releases are published from version tags)
        type: choice
        default: transient
        options:
          - transient
      only:
        description: Build only the matrix entry with this name (empty builds all)
        type: string
        default: ''
  schedule:
    - cron: "23 4 * * *"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: python
        env:
          ONLY: ${{ inputs.only }}
        run: |
          import json, os
          # Apple Silicon ships twice: a CPU-only archive and a larger one with the Apple GPU (MPS) backend.
          entries = [
              {"name": "macos-15", "os": "macos-15", "mps": "off"},
              {"name": "macos-15-mps", "os": "macos-15", "mps": "on"},
              {"name": "macos-15-intel", "os": "macos-15-intel", "mps": "off"},
              {"name": "ubuntu-24.04", "os": "ubuntu-24.04", "mps": "off"},
              {"name": "ubuntu-24.04-arm", "os": "ubuntu-24.04-arm", "mps": "off"},
              {"name": "windows-2022", "os": "windows-2022", "mps": "off"},
          ]
          only = os.environ.get("ONLY", "")
          if only:
              entries = [e for e in entries if e["name"] == only]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps(entries) + "\n")

  build-archive:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          # Sparse checkout omits generated build files with Windows-reserved names.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
        with:
          sparse-checkout: |
            PlussAI
            PlussMa
            PlussMic
            PlussPl
            PlussQit
            PlussTils
            .github/actions
            ExLibs
            cmake
            docs
            examples
            include
            pluss
            tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux curl development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      # Static libzip, Arrow and Parquet go inside the archive; users install nothing.
      - name: Build static native dependencies
        uses: ./.github/actions/native-deps

      - name: Diagnose Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $inst = "$env:VCPKG_ROOT/installed/$env:PLUSSII_VCPKG_TRIPLET"
          Write-Host "triplet=$env:PLUSSII_VCPKG_TRIPLET root=$env:VCPKG_ROOT"
          Get-ChildItem "$env:VCPKG_ROOT/installed" | Format-Table Name
          Get-ChildItem "$inst/include/sqlite3*.h" | Format-Table FullName
          Get-ChildItem "$inst/lib" -Filter "sqlite3*" | Format-Table FullName
          & "$env:VCPKG_ROOT/vcpkg" list | Select-String "sqlite3|libzip|arrow|curl"
          Write-Host "CMAKE_PREFIX_PATH=$env:CMAKE_PREFIX_PATH"
          New-Item -ItemType Directory -Force probe | Out-Null
          $probe = @(
            'cmake_minimum_required(VERSION 3.28)',
            'project(probe LANGUAGES CXX)',
            'message(STATUS "PREFIX=${CMAKE_PREFIX_PATH}")',
            'foreach(pkg libzip Arrow Parquet CURL)',
            '  find_package(${pkg} CONFIG)',
            '  message(STATUS "PROBE ${pkg} found=${${pkg}_FOUND} dir=${${pkg}_DIR}")',
            'endforeach()',
            'find_package(SQLite3)',
            'message(STATUS "PROBE SQLite3 found=${SQLite3_FOUND} ${SQLite3_INCLUDE_DIR} ${SQLite3_LIBRARY}")'
          )
          Set-Content probe/CMakeLists.txt $probe
          cmake -S probe -B probe/build -T ClangCL -DCMAKE_BUILD_TYPE=Release "-DVCPKG_TARGET_TRIPLET=$env:PLUSSII_VCPKG_TRIPLET" "-DCMAKE_TOOLCHAIN_FILE=$env:PLUSSII_VCPKG_TOOLCHAIN"

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Quote every -D value: an unquoted -DX=$env:Y reaches CMake as the literal text "$env:Y".
          cmake -S . -B build -T ClangCL -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPLUSSQIT_BUILD_TESTS=OFF -DPLUSSQIT_BUILD_EXAMPLES=OFF -DPLUSSMIC_FETCH_CURL=OFF -DPLUSSMIC_REQUIRE_CURL=ON -DPLUSSMIC_BUNDLE_NATIVE_DEPS=ON -DPLUSSMIC_REQUIRE_EXCEL=ON -DPLUSSMIC_REQUIRE_PARQUET=ON "-DVCPKG_TARGET_TRIPLET=$env:PLUSSII_VCPKG_TRIPLET" "-DCMAKE_TOOLCHAIN_FILE=$env:PLUSSII_VCPKG_TOOLCHAIN"

      - name: Configure macOS and Ubuntu
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPLUSSQIT_BUILD_TESTS=OFF -DPLUSSQIT_BUILD_EXAMPLES=OFF -DPLUSSMIC_FETCH_CURL=OFF -DPLUSSMIC_REQUIRE_CURL=ON -DPLUSSMIC_BUNDLE_NATIVE_DEPS=ON -DPLUSSMIC_REQUIRE_EXCEL=ON -DPLUSSMIC_REQUIRE_PARQUET=ON -DVCPKG_TARGET_TRIPLET=$PLUSSII_VCPKG_TRIPLET -DCMAKE_TOOLCHAIN_FILE=$PLUSSII_VCPKG_TOOLCHAIN ${{ matrix.mps == 'on' && '-DPLUSSII_DISTRIBUTION_SUFFIX=mps' || '-DPLUSSQIT_ENABLE_MPS=OFF' }}

      - name: Stage distribution
        run: cmake --build build --config Release --target plussii_distribution_stage --parallel 2

      - name: Package and validate downloadable ZIP
        run: cmake "-DDISTRIBUTION_BUILD_DIR=${{ github.workspace }}/build" "-DDISTRIBUTION_SOURCE_DIR=${{ github.workspace }}" -P cmake/VerifyStagedDistribution.cmake

      - name: Upload validated ZIP
        uses: actions/upload-artifact@v4
        with:
          name: plussii-cpp-${{ matrix.name }}
          path: build/plussii-cpp-*.zip
          if-no-files-found: error

  publish:
    needs: build-archive
    # Only main (Transient) and version tags (Steady) publish; a run from any
    # other branch builds and validates the archives but never touches a release.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout version
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CMakeLists.txt
            docs/releases

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^project(plussma VERSION \([0-9][0-9.]*\) LANGUAGES CXX)/\1/p' CMakeLists.txt)"
          if [[ -z "$version" || "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match CMake version v${version}."
            exit 1
          fi

      - name: Download validated ZIPs
        uses: actions/download-artifact@v4
        with:
          pattern: plussii-cpp-*
          path: release-assets
          merge-multiple: true

      - name: Label Transient archives
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        working-directory: release-assets
        run: |
          shopt -s nullglob
          for archive in plussii-cpp-*.zip; do
            platform="${archive#plussii-cpp-}"
            platform="${platform#*-}"
            mv "$archive" "plussii-cpp-transient-${platform}"
          done

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum plussii-cpp-*.zip > SHA256SUMS.txt

      - name: Move Transient tag to validated source
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/transient" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/transient" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/transient' -f sha="$GITHUB_SHA"
          fi

      - name: Publish Steady release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/plussii-cpp-*.zip
            release-assets/SHA256SUMS.txt
          body_path: docs/releases/${{ github.ref_name }}.md
          make_latest: true

      - name: Publish Transient release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: transient
          name: PlussII Transient
          prerelease: true
          make_latest: false
          body_path: docs/releases/transient.md
          files: |
            release-assets/plussii-cpp-*.zip
            release-assets/SHA256SUMS.txt
