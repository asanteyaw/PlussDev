name: PlussII C++ Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build and validate
        type: choice
        default: all
        options:
          - all
          - linux-arm64
          - macos-intel
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-archive:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux-arm64' && '["ubuntu-24.04-arm"]' || inputs.platform == 'macos-intel' && '["macos-15-intel"]' || '["macos-15","macos-15-intel","ubuntu-24.04","ubuntu-24.04-arm","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          # Sparse checkout omits generated build files with Windows-reserved names.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
        with:
          sparse-checkout: |
            PlussAI
            PlussMa
            PlussMic
            PlussPl
            PlussQit
            PlussTils
            ExLibs
            cmake
            docs
            examples
            include
            pluss
            tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux curl development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        run: vcpkg install sqlite3:x64-windows-static curl:x64-windows-static

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -T ClangCL -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPLUSSQIT_BUILD_TESTS=OFF -DPLUSSQIT_BUILD_EXAMPLES=OFF -DPLUSSMIC_FETCH_CURL=OFF -DPLUSSMIC_REQUIRE_CURL=ON -DVCPKG_TARGET_TRIPLET=x64-windows-static "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Configure macOS and Ubuntu
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPLUSSQIT_BUILD_TESTS=OFF -DPLUSSQIT_BUILD_EXAMPLES=OFF -DPLUSSMIC_FETCH_CURL=OFF -DPLUSSMIC_REQUIRE_CURL=ON

      - name: Stage distribution
        run: cmake --build build --config Release --target plussii_distribution_stage --parallel 2

      - name: Package and validate downloadable ZIP
        run: cmake "-DDISTRIBUTION_BUILD_DIR=${{ github.workspace }}/build" "-DDISTRIBUTION_SOURCE_DIR=${{ github.workspace }}" -P cmake/VerifyStagedDistribution.cmake

      - name: Upload validated ZIP
        uses: actions/upload-artifact@v4
        with:
          name: plussii-cpp-${{ matrix.os }}
          path: build/plussii-cpp-*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-archive
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout version
        uses: actions/checkout@v4
        with:
          sparse-checkout: CMakeLists.txt

      - name: Check release version
        shell: bash
        run: |
          version="$(sed -n 's/^project(plussma VERSION \([0-9][0-9.]*\) LANGUAGES CXX)/\1/p' CMakeLists.txt)"
          if [[ -z "$version" || "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match CMake version v${version}."
            exit 1
          fi

      - name: Download validated ZIPs
        uses: actions/download-artifact@v4
        with:
          pattern: plussii-cpp-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum plussii-cpp-*.zip > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/plussii-cpp-*.zip
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
