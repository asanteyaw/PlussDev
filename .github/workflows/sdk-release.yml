name: PlussII C++ Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  cpp-release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPLUSSQIT_BUILD_TESTS=OFF -DPLUSSQIT_BUILD_EXAMPLES=OFF

      - name: Check Release Version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match CMake version v${version}."
            exit 1
          fi

      - name: Build PlussII C++ Archives
        run: cmake --build build --target pluss_sdk_archive -j1

      - name: Validate Downloadable Archive
        run: |
          cmake \
            -DDISTRIBUTION_ARCHIVE="$(pwd)/$(find build -maxdepth 1 -name 'plussii-cpp-*.zip' -print -quit)" \
            -DCONSUMER_SOURCE_DIR="$(pwd)/examples/sdk_consumer" \
            -DVALIDATION_WORK_DIR="$(pwd)/build/distribution-validation" \
            -P cmake/ValidateDistribution.cmake

      - name: Generate Checksums
        working-directory: build
        run: shasum -a 256 plussii-cpp-*.zip plussii-cpp-*.tar.gz > SHA256SUMS.txt

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plussii-cpp-${{ github.ref_name || 'manual' }}
          path: |
            build/plussii-cpp-*.zip
            build/plussii-cpp-*.tar.gz
            build/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/plussii-cpp-*.zip
            build/plussii-cpp-*.tar.gz
            build/SHA256SUMS.txt
          generate_release_notes: true
