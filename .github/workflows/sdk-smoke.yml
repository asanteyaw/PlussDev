name: SDK Smoke

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  sdk-smoke:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            PlussAI
            PlussMa
            PlussMic
            PlussPl
            PlussQit
            PlussTils
            ExLibs
            cmake
            docs
            examples
            include
            pluss
            tools

      - name: Configure
        run: cmake -S . -B build

      - name: Run SDK Consumer Smoke Test
        run: ctest --test-dir build --output-on-failure -R pluss_sdk_consumer_smoke
