summary = """
Compare the current frame for equality against a scalar, a slate, or another frame and return a boolean-style result frame.

`eq(...)` is the explicit named equality surface when you want a reusable mask table instead of operator syntax.
"""

returns = """
`DataFrame`
    Boolean-style frame marking which participating cells compare equal under the selected overload.
"""

see_also = [
  "<a href=\"#equals\"><code>DataFrame::equals</code></a>: whole-frame exact identity check that returns one `bool` instead of a mask frame.",
  "<a href=\"#ne\"><code>DataFrame::ne</code></a>: not-equal comparison.",
  "<a href=\"../../slate_api_reference.md#eq\"><code>Slate::eq</code></a>: equality comparison on one extracted slate."
]

notes = [
  """
Numeric scalar equality broadcasts one value across compatible numeric features.
""",
  """
Text scalar equality is most useful on note-backed columns. It maps the comparison across the current frame's slates and returns a boolean-style frame.
""",
  """
Frame-to-frame equality compares matched cells. When you need explicit structural matching rules, use the overload that accepts `AlignOptions`.
"""
]

[[parameters]]
name = "other"
body = """
Right-hand equality target.

Supported overload families include:

- numeric scalar broadcast such as `84.0`,
- text scalar broadcast such as `"Ada"`,
- `const Slate&` when you want one slate compared across a chosen axis,
- `const DataFrame&` when you want cellwise frame-to-frame equality.
"""

[[parameters]]
name = "axis"
body = """
Axis used by the slate overload.

- `Axis::Feature`: compare one slate across features.
- `Axis::Case`: compare one slate across cases.

Use the examples below as the primary guide for when a slate is being interpreted row-wise versus column-wise.
"""

[[parameters]]
name = "options"
body = """
Optional alignment rules for overloads that compare against another `DataFrame` or `Slate`.

This is where you choose label-aware matching behavior such as `AlignBy::Both` when the right-hand side has a different row order or a smaller structural footprint.
"""

[[examples]]
title = "Broadcast one numeric scalar across the current frame."
code = """
using namespace pluss::table;

auto scores = DataFrame({
    {"quiz", pluss::make_series({84.0, 90.0, 84.0})},
    {"final", pluss::make_series({84.0, 88.0, 72.0})},
}, pluss::make_note({"s1", "s2", "s3"}));

auto out = scores.eq(84.0);
"""
output = """
===================
     | quiz   final
-------------------
s1   | true   true
s2   | false  false
s3   | true   false
-------------------
[3 cs x 2 feat]
"""

[[examples]]
title = "Broadcast one text scalar across a note-backed feature."
code = """
using namespace pluss::table;

auto names = DataFrame({
    {"name", pluss::make_note({"Ada", "Bola", "Ada"})},
}, pluss::make_note({"s1", "s2", "s3"}));

auto out = names.eq("Ada");
"""
output = """
============
     | name
------------
s1   | true
s2   | false
s3   | true
------------
[3 cs x 1 feat]
"""

[[examples]]
title = "Compare two frames cell by cell when they already share the same structure."
code = """
using namespace pluss::table;

auto official = DataFrame({
    {"quiz", pluss::make_series({84.0, 90.0, 84.0})},
    {"final", pluss::make_series({84.0, 88.0, 72.0})},
}, pluss::make_note({"s1", "s2", "s3"}));

auto changed = DataFrame({
    {"quiz", pluss::make_series({84.0, 90.0, 83.0})},
    {"final", pluss::make_series({84.0, 88.0, 72.0})},
}, pluss::make_note({"s1", "s2", "s3"}));

auto out = official.eq(changed);
"""
output = """
===================
     | quiz   final
-------------------
s1   | true   true
s2   | true   true
s3   | false  true
-------------------
[3 cs x 2 feat]
"""

[[examples]]
title = "Use `AlignOptions` when the right-hand frame has a different row and feature order."
code = """
using namespace pluss::table;

auto official = DataFrame({
    {"quiz", pluss::make_series({84.0, 90.0, 84.0})},
    {"final", pluss::make_series({84.0, 88.0, 72.0})},
}, pluss::make_note({"s1", "s2", "s3"}));

auto reordered = DataFrame({
    {"final", pluss::make_series({72.0, 84.0})},
    {"quiz", pluss::make_series({84.0, 84.0})},
}, pluss::make_note({"s3", "s1"}));

auto out = official.eq(reordered, AlignOptions{.align = AlignBy::Both});
"""
output = """
==================
     | quiz  final
------------------
s1   | true  true
s2   | NA    NA
s3   | true  true
------------------
[3 cs x 2 feat]
"""
