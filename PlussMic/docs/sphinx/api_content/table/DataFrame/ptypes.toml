summary = """
Return the payload-family summary for every feature in the frame.

`ptypes()` answers “which Pluss payload does each feature hold?” without exposing scalar storage detail.
"""

returns = """
`DTypes`
    An ordered `(feature name, payload family)` view. Members: `size()`, `empty()`, `contains(name)`, `at(name)` / `operator[](name)` (both throw on an unknown name), `entries()` (the whole `(name, family)` list by const reference), `payloads()` (the family strings alone, value-owned), range-based iteration over `(name, family)` pairs, and `operator<<` (a `features  dtype` header, a `--------  --------` rule, then one unpadded `name  family` line per feature). `dtypes()` returns the same object with `Series<float64>`-style strings instead.
"""

see_also = [
  "<a href=\"#dtypes\"><code>DataFrame::dtypes</code></a>: inspect concrete feature dtypes.",
  "<a href=\"#feataxis\"><code>DataFrame::feataxis</code></a>: select features by payload family."
]

notes = [
  """
Use `ptypes()` for high-level routing decisions: numeric work usually starts from `Series`, text work from `Note`, datetime work from `Timeline`, and time-axis work from `TimeIndex`.
""",
  """
References from `at()` / `operator[]` / `entries()` point into the `DTypes` object -- bind it to a name before taking one. `payloads()` returns owned strings and is safe on a temporary. `DTypes` is a snapshot and holds no reference to the frame.
"""
]

[[examples]]
title = "Inspect payload families."
code = """
using namespace pluss::table;

auto raw = DataFrame({
    {"student_id", pluss::make_series({101.0, 102.0, 103.0})},
    {"raw_name", pluss::make_note({"Ada", "Bola", "Chen"})},
});

auto out = raw.ptypes();
"""
output = """
student_id: Series
raw_name: Note
"""
