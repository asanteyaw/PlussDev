summary = """
Expose the underlying `pluss::TimeIndex` payload directly.

`Slate::as_timeindex()` is the indexed-temporal escape hatch for resampling, calendar bucketing, and time-index-specific kernels that live below the Slate surface.
"""

returns = """
`const pluss::TimeIndex&`
    Reference to the underlying indexed temporal payload.
"""

see_also = [
  "<a href=\"#as_timeline\"><code>Slate::as_timeline</code></a>: expose a timeline payload instead of a time index.",
  "<a href=\"dataframe_api_reference.html#ts\"><code>DataFrame::ts</code></a>: open the time-series surface for full-frame resampling."
]

notes = [
  """
This method is useful when the operation you want exists on `TimeIndex` but not on `Slate`.
""",
  """
Wrap the result back into `Slate(...)` if a downstream table API expects a slate again.
"""
]

[[examples]]
title = "Use the TimeIndex payload for daily resample counts and wrap the result back into a Slate."
code = """
using namespace pluss::table;

auto ticks = Slate(pluss::timeindex::make({
    "2024-01-01T00:10:00Z",
    "2024-01-01T00:20:00Z",
    "2024-01-01T01:10:00Z",
    "2024-01-02T00:15:00Z",
}, true));

auto out = Slate(ticks.as_timeindex().resample_count("D", 1));
"""
output = """
0  3
1  1
ptype: Series
"""
