summary = """
Return the elementwise absolute value of a numeric slate.

`Slate::abs()` is the sign-stripping numeric helper for one-dimensional data. Use it when magnitude matters more than direction, such as absolute error, distance-from-target, or symmetric-threshold preprocessing.
"""

returns = """
`Slate`
    A numeric slate containing the absolute value of each element.
"""

see_also = [
  "<a href=\"#clip\"><code>Slate::clip</code></a>: cap values into a range instead of removing sign.",
  "<a href=\"#pow\"><code>Slate::pow</code></a>: apply power transformations after magnitude cleanup when needed."
]

notes = [
  """
This method is for numeric slates. Text and temporal payloads are not valid inputs.
""",
  """
The result is non-mutating. The current slate is left unchanged.
"""
]

[[examples]]
title = "Take the absolute value of a numeric slate."
code = """
using namespace pluss::table;

auto scores = Slate(pluss::make_series({-2.5, 0.0, 3.5}));

auto out = scores.abs();
"""
output = """
0  2.5
1  0
2  3.5
ptype: Series
"""
