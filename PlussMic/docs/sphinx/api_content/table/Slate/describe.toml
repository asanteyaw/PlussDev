summary = """
Summarize one slate instead of carrying every original value forward.

`describe()` adapts to the payload family: numeric slates get numeric descriptive statistics, while note slates get count/unique/top/freq style summaries.

This is the direct per-column analogue of `DataFrame::describe()` when you already know which one slate you want to inspect.
"""

returns = """
`SlateView`
    Compact summary view of the current slate.
"""

notes = [
  """
Numeric series and note-backed text slates follow different summary contracts, so the output shape depends on the payload family.
""",
  """
For numeric slates, the statistics are ordered as `count`, `mean`, `std`, `min`, `25%`, `50%`, `75%`, `max`.
""",
  """
For note slates, the summary is frequency-oriented: observed count, number of unique values, most frequent value, and its frequency.
"""
]

[[parameters]]
name = "render"
body = """
Display toggle for the returned view.

- `false`: keep explicit control over when the summary is printed.
- `true`: allow the returned view to auto-render in temporary display contexts.
"""

[[examples]]
title = "Describe a numeric slate."
code = """
using namespace pluss::table;

auto out = Slate(pluss::make_series({10.0, 20.0, 30.0, 40.0})).describe(false);
"""
output = """
count  4
 mean  25
  std  12.90994449
  min  10
  25%  17.5
  50%  25
  75%  32.5
  max  40
Name: value, ptype: Series
"""

[[examples]]
title = "Describe a note-backed text slate."
code = """
using namespace pluss::table;

auto out = Slate(pluss::make_note({"Accra", "Tema", "Accra", "Kumasi", "Tema"})).describe(false);
"""
output = """
 count  5
unique  3
   top  Accra
  freq  2
Name: value, ptype: Note
"""
