summary = """
Slice characters out of each note-backed text entry.

This is the per-entry string-slicing surface for text slates.
"""

returns = """
`Slate`
    Note-backed slate containing the extracted character slices.
"""

[[parameters]]
name = "start"
body = """
Inclusive starting character position.
"""

[[parameters]]
name = "stop"
body = """
Optional exclusive ending position.

Leave this empty to slice to the end of each string.
"""

[[parameters]]
name = "step"
body = """
Character stride.

- `1`: keep every character in the requested window.
- `2`: keep every second character, and so on.
"""

[[examples]]
title = "Take the leading code letter from each text value."
code = """
using namespace pluss::table;

auto codes = Slate(pluss::make_note({"A-001", "B-002", "C-003"}));

auto out = codes.chars(0, 1);
"""
output = """
0  A
1  B
2  C
ptype: Note
"""

[[examples]]
title = "Take every second character from the beginning to the end."
code = """
using namespace pluss::table;

auto codes = Slate(pluss::make_note({"A-001", "B-002", "C-003"}));

auto out = codes.chars(0, std::nullopt, 2);
"""
output = """
0  A01
1  B02
2  C03
ptype: Note
"""
