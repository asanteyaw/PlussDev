summary = """
Apply the natural exponential function elementwise to a numeric slate.

`exp()` is the slate-level `e^x` surface for series payloads. It is useful in probability, growth, soft transforms, and any workflow where you need exponential recovery after a log-domain transformation.
"""

returns = """
`Slate`
    Numeric slate containing `exp(x)` for each valid entry.
"""

see_also = [
  "<a href=\"#log\"><code>Slate::log</code></a>: inverse natural-log transform.",
  "<a href=\"#pow\"><code>Slate::pow</code></a>: more general exponentiation surface."
]

notes = [
  """
`exp()` is only valid for numeric series payloads.
""",
  """
Integer-like numeric series are promoted internally to a floating type before the exponential is computed.
"""
]

[[examples]]
title = "Exponentiate a small numeric slate."
code = """
using namespace pluss::table;

auto out = Slate(pluss::make_series({0.0, 1.0, 2.0})).exp();
"""
output = """
0  1
1  2.718281828
2  7.389056099
ptype: Series
"""
