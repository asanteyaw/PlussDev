summary = """
Expose the underlying `pluss::Series` payload directly.

`Slate::as_series()` is the numeric escape hatch when you want the full Series surface rather than the curated Slate surface. It is especially useful for direct arithmetic chains, native Series reductions, or specialized kernels that already live below the table layer.
"""

returns = """
`const pluss::Series&`
    Reference to the underlying series payload.
"""

see_also = [
  "<a href=\"#astype\"><code>Slate::astype</code></a>: keep the operation on the Slate surface when you only need dtype conversion.",
  "<a href=\"#as_note\"><code>Slate::as_note</code></a>: switch to the text payload instead of the numeric one."
]

notes = [
  """
This method returns the underlying payload reference. It does not automatically rewrap the result into `Slate`.
""",
  """
If you want to call a Slate-only method after Series work, wrap the result back as `Slate(series_result)`.
"""
]

[[examples]]
title = "Use the Series payload for arithmetic, then wrap the result back into a Slate."
code = """
using namespace pluss::table;

auto scores = Slate(pluss::make_series({-2.5, 0.0, 3.5}));

auto out = Slate(scores.as_series() + 5.0);
"""
output = """
0  2.5
1  5
2  8.5
ptype: Series
"""
