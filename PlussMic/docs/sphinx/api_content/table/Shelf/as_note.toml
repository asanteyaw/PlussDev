summary = """
Expose the underlying `pluss::Note` payload directly.

`Shelf::as_note()` is the escape hatch you use when `Shelf` itself intentionally stays smaller than the full text-method surface. Once you have the `Note`, you can call Note-specific text operations and then wrap the result back into `Shelf` only when a shelf-aware API needs it again.
"""

returns = """
`const pluss::Note&`
    Reference to the underlying note payload.
"""

see_also = [
  "<a href=\"#as_series\"><code>Shelf::as_series</code></a>: expose the numeric payload directly.",
  "<a href=\"#as_timeline\"><code>Shelf::as_timeline</code></a>: expose the temporal payload directly.",
  "<a href=\"#as_timeindex\"><code>Shelf::as_timeindex</code></a>: expose the indexed temporal payload directly."
]

notes = [
  """
This method does not create a new shelf by itself. It returns the underlying payload reference.
""",
  """
If a downstream API expects `Shelf`, wrap the transformed payload back as `Shelf(note_result)`.
"""
]

[[examples]]
title = "Use the Note payload to run text cleanup and then wrap it back into a Shelf."
code = """
using namespace pluss::table;

auto names = Shelf(pluss::make_note({" Ada ", "BOLA", " chen "}));

auto out = Shelf(names.as_note().strip().lower());
"""
output = """
0  ada
1  bola
2  chen
ptype: Note
"""
